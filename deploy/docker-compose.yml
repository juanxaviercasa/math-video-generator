version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: math-video-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: math_video_generator
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: math-video-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: math-video-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/math_video_generator
      DIRECT_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/math_video_generator
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-32-character-secret}
      SUPABASE_URL: ${SUPABASE_URL:-https://placeholder.supabase.co}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-placeholder}
      APP_URL: ${APP_URL:-http://localhost:3000}
      BACKEND_PORT: 3001
      MEDIA_ROOT: /var/lib/math-video-generator/media
      VIDEO_QUEUE_NAME: math-video-generation
      VIDEO_WORKER_CONCURRENCY: ${VIDEO_WORKER_CONCURRENCY:-1}
      TTS_PROVIDER: ${TTS_PROVIDER:-edge}
      TTS_NEURAL_VOICE: ${TTS_NEURAL_VOICE:-es-MX-DaliaNeural}
      TTS_ALLOW_LOCAL_FALLBACK: ${TTS_ALLOW_LOCAL_FALLBACK:-false}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/var/lib/math-video-generator/media
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/index.js"]

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: math-video-worker
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/math_video_generator
      DIRECT_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/math_video_generator
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-32-character-secret}
      SUPABASE_URL: ${SUPABASE_URL:-https://placeholder.supabase.co}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-placeholder}
      MEDIA_ROOT: /var/lib/math-video-generator/media
      VIDEO_QUEUE_NAME: math-video-generation
      VIDEO_WORKER_CONCURRENCY: ${VIDEO_WORKER_CONCURRENCY:-1}
      TTS_PROVIDER: ${TTS_PROVIDER:-edge}
      TTS_NEURAL_VOICE: ${TTS_NEURAL_VOICE:-es-MX-DaliaNeural}
      TTS_ALLOW_LOCAL_FALLBACK: ${TTS_ALLOW_LOCAL_FALLBACK:-false}
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - media_data:/var/lib/math-video-generator/media
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/worker.js"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
    container_name: math-video-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  media_data:
