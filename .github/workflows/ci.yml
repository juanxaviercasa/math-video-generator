name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate personal Docker Compose without real secrets
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/postgres
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/postgres
          JWT_SECRET: 0123456789abcdef0123456789abcdef
          OWNER_USER_ID: e233caa1-3a71-4c2c-a731-71af5e6d84b0
          SUPABASE_URL: https://jplhbgyhswvbghhzhjvm.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          APP_URL: https://math.forjavia.site
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f deploy/docker-compose.yml config --format json > /tmp/math-compose-ci.json
          node - <<'NODE'
          const fs = require('node:fs')
          const cfg = JSON.parse(fs.readFileSync('/tmp/math-compose-ci.json', 'utf8'))
          if (cfg.services.postgres) throw Error('Oracle must not run a duplicate Postgres service')
          if (cfg.services.redis.ports?.length) throw Error('Redis must stay private')
          if (!cfg.services.backend.environment.DATABASE_URL) throw Error('Supabase database URL missing')
          if (!cfg.services.backend.environment.SUPABASE_URL.includes('jplhbgyhswvbghhzhjvm')) throw Error('Wrong Supabase project')
          if (cfg.services.worker.ports?.length) throw Error('Worker must not be published')
          const apiPorts = cfg.services.backend.ports || []
          if (apiPorts.length !== 1 || apiPorts[0].host_ip !== '127.0.0.1') {
            throw Error('Backend API must bind only to localhost')
          }
          if (cfg.services.backend.environment.PERSONAL_MODE !== 'true') {
            throw Error('Personal owner mode must be enabled')
          }
          if (cfg.services.worker.environment.VIDEO_WORKER_CONCURRENCY !== '1') {
            throw Error('Personal worker concurrency must be 1')
          }
          console.log('Private Compose config validated: no duplicate Postgres, private Redis, single-owner mode, localhost API.')
          NODE

      - name: Verify Cloudflare Pages files
        run: |
          test -s frontend/dist/_redirects
          test -s frontend/dist/_headers

      # This is a deployable static build, not a claim that a Cloudflare site exists.
      # Prefer connecting Pages to GitHub for automatic future production deploys.
      - name: Upload private Cloudflare Pages build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: math-video-frontend-cloudflare
          path: frontend/dist/
          retention-days: 7
          if-no-files-found: error
